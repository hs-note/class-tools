<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>授業の道具箱</title>
<meta name="description" content="ブラウザで開くだけで使える授業の教材。インストール不要で、PCでもiPadでも使えます。">
<style>
:root{
  color-scheme: light;
  --ground:#E9EEF3;
  --panel:#FFFFFF;
  --plot:#F7F9FB;
  --ink:#14202B;
  --muted:#566472;
  --rule:#CFD8E1;
  --grid:#DCE3EA;
  --analog:#2E5FCC;
  --digital:#E0560E;
  --focus:#1B4FB8;
  --font:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --mono:"BIZ UDGothic","Consolas","Menlo",ui-monospace,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--ground)}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:960px;margin-inline:auto;padding-inline:16px;padding-block:calc(28px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px));display:grid;gap:28px}
h1,h2{margin:0;line-height:1.3;text-wrap:balance}
p{margin:0}
a{color:var(--analog)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* 見出し */
.masthead{display:grid;gap:12px}
.eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.08em;color:var(--muted)}
h1{font-size:clamp(28px,4.2vw,42px);letter-spacing:.02em}
.lead{max-width:40em;color:var(--muted)}
.howto{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.howto li{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;background:var(--panel);border:1px solid var(--rule);border-radius:999px;font-size:14px}
.howto .n{display:grid;place-items:center;flex:none;width:24px;height:24px;border-radius:50%;background:var(--digital);color:#fff;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}

/* 教材カード */
.list{display:grid;gap:16px}
.tool{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px 28px;align-items:center;background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:22px 24px}
.tool-body{display:grid;gap:10px;justify-items:start}
.tag{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.subject{padding:1px 10px;border-radius:6px;background:var(--ink);color:#fff;font-weight:700}
.tool h2{font-size:clamp(20px,2.6vw,26px)}
.desc{color:var(--ink)}
.feats{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.feats li{padding:2px 10px;border:1px solid var(--rule);background:var(--plot);border-radius:999px;font-size:12.5px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);background:var(--panel);border-radius:10px;padding:10px 18px;font-weight:700;text-decoration:none;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--digital);border-color:var(--digital);color:#fff}
.btn:hover{filter:brightness(.96)}

.qr{margin:0;display:grid;justify-items:center;gap:6px;width:176px}
.qr-img{width:100%;background:#fff;border:1px solid var(--rule);border-radius:10px;padding:6px;line-height:0}
.qr-img svg{display:block;width:100%;height:auto}
.qr-fail{line-height:1.5;font-size:13px;color:var(--muted);padding:18px 8px;text-align:center}
.qr figcaption,.url{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;overflow-wrap:anywhere;line-height:1.4}

/* QRを大きく表示 */
.overlay{position:fixed;inset:0;z-index:10;background:var(--ground);overflow:auto;display:grid;place-items:center;padding:calc(64px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.big{display:grid;justify-items:center;gap:14px;text-align:center;max-width:100%}
.big .tag{justify-content:center;font-size:15px}
.big h2{font-size:clamp(22px,3.4vw,38px)}
.big .qr-img{width:min(68vmin,600px);padding:12px;border-radius:14px}
.big .url{font-size:clamp(14px,2.2vw,22px);color:var(--ink)}
.close{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:16px}

footer{font-size:12.5px;color:var(--muted);border-top:1px solid var(--grid);padding-top:14px}

@media (max-width:600px){
  .tool{grid-template-columns:minmax(0,1fr);padding:18px}
  .tool .qr{justify-self:center;width:150px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <p class="eyebrow">class-tools</p>
    <h1>授業の道具箱</h1>
    <p class="lead">ブラウザで開くだけで使える授業の教材です。インストールは要りません。PC でも iPad でも、そのまま動きます。</p>
    <ol class="howto" aria-label="iPadで開く手順">
      <li><span class="n">1</span>「QR を大きく表示」をスクリーンに映す</li>
      <li><span class="n">2</span>iPad のカメラで QR を読み取る</li>
      <li><span class="n">3</span>出てきたリンクを押して開く</li>
    </ol>
  </header>

  <main class="list" id="list" aria-label="教材の一覧">
    <noscript>
      <p><a href="sound/">音のデジタル化シミュレーター</a></p>
    </noscript>
  </main>

  <footer>
    QR コードの生成に <a href="https://github.com/kazuhikoarase/qrcode-generator">qrcode-generator</a>（Copyright (c) 2009 Kazuhiko Arase／<a href="lib/qrcode-generator/LICENSE">MIT License</a>）を使っています。「QR コード」は株式会社デンソーウェーブの登録商標です。
  </footer>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="bigTitle" hidden>
  <button type="button" class="btn close" id="closeBig">閉じる</button>
  <div class="big">
    <p class="tag" id="bigTag"></p>
    <h2 id="bigTitle"></h2>
    <div class="qr-img" id="bigQr"></div>
    <p class="url" id="bigUrl"></p>
  </div>
</div>

<script src="lib/qrcode-generator/qrcode.js"></script>
<script>
(() => {
  // 教材を足すときは、ここに1件足すだけ（QRは自動で作られる）
  const BASE = 'https://km-note.github.io/class-tools/';
  const TOOLS = [
    {
      path: 'sound/',
      subject: '情報Ⅰ',
      unit: '音のデジタル化',
      title: '音のデジタル化シミュレーター',
      desc: '標本化・量子化・符号化を、グラフの変化と音で確かめる。送る 0 と 1 の列や、データ量の計算も出る。',
      feats: ['グラフ', '音を聞く', '自分の声を録音', 'データ量の計算']
    }
  ];

  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };

  function qrSvg(text, label) {
    if (typeof qrcode !== 'function') return null;
    const qr = qrcode(0, 'M');
    qr.addData(text);
    qr.make();
    const n = qr.getModuleCount(), q = 4, size = n + q * 2;
    let d = '';
    for (let r = 0; r < n; r++) {
      let c = 0;
      while (c < n) {
        if (!qr.isDark(r, c)) { c++; continue; }
        const start = c;
        while (c < n && qr.isDark(r, c)) c++;
        d += `M${start + q} ${r + q}h${c - start}v1h-${c - start}z`;
      }
    }
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', `0 0 ${size} ${size}`);
    svg.setAttribute('shape-rendering', 'crispEdges');
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', label);
    const bg = document.createElementNS(svg.namespaceURI, 'rect');
    bg.setAttribute('width', size); bg.setAttribute('height', size); bg.setAttribute('fill', '#ffffff');
    const path = document.createElementNS(svg.namespaceURI, 'path');
    path.setAttribute('d', d); path.setAttribute('fill', '#14202B');
    svg.append(bg, path);
    return svg;
  }

  function fillQr(box, url, label) {
    box.replaceChildren();
    let svg = null;
    try { svg = qrSvg(url, label); } catch (e) { svg = null; }
    if (svg) box.append(svg);
    else box.append(el('p', 'qr-fail', 'QR コードを表示できませんでした。下の URL を使ってください。'));
  }

  // URLを「/」の直後だけで折り返す
  function urlText(node, url) {
    node.replaceChildren();
    const parts = url.replace(/^https:\/\//, '').split('/');
    parts.forEach((p, i) => {
      if (i < parts.length - 1) node.append(p + '/', document.createElement('wbr'));
      else if (p) node.append(p);
    });
    return node;
  }

  function tagRow(t) {
    const p = el('p', 'tag');
    p.append(el('span', 'subject', t.subject), el('span', null, t.unit));
    return p;
  }

  const list = document.getElementById('list');
  const overlay = document.getElementById('overlay');
  let lastFocus = null;

  function openBig(t) {
    const url = BASE + t.path;
    document.getElementById('bigTag').replaceWith(Object.assign(tagRow(t), { id: 'bigTag' }));
    document.getElementById('bigTitle').textContent = t.title;
    urlText(document.getElementById('bigUrl'), url);
    fillQr(document.getElementById('bigQr'), url, `${t.title}を開くQRコード`);
    lastFocus = document.activeElement;
    overlay.hidden = false;
    document.body.style.overflow = 'hidden';
    document.getElementById('closeBig').focus();
  }
  function closeBig() {
    overlay.hidden = true;
    document.body.style.overflow = '';
    if (lastFocus) lastFocus.focus();
  }
  document.getElementById('closeBig').addEventListener('click', closeBig);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeBig(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !overlay.hidden) closeBig(); });

  const frag = document.createDocumentFragment();
  TOOLS.forEach(t => {
    const url = BASE + t.path;
    const card = el('article', 'tool');
    const body = el('div', 'tool-body');
    const feats = el('ul', 'feats');
    t.feats.forEach(f => feats.append(el('li', null, f)));
    const actions = el('div', 'actions');
    const open = el('a', 'btn primary', '開く');
    open.href = t.path;
    const bigBtn = el('button', 'btn', 'QR を大きく表示');
    bigBtn.type = 'button';
    bigBtn.addEventListener('click', () => openBig(t));
    actions.append(open, bigBtn);
    body.append(tagRow(t), el('h2', null, t.title), el('p', 'desc', t.desc), feats, actions);

    const fig = el('figure', 'qr');
    const box = el('div', 'qr-img');
    fillQr(box, url, `${t.title}を開くQRコード`);
    fig.append(box, urlText(el('figcaption'), url));

    card.append(body, fig);
    frag.append(card);
  });
  list.append(frag);
})();
</script>
</body>
</html>
