<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>情報Ⅱの道具箱</title>
<meta name="description" content="情報Ⅱで使う教材。ブラウザで開くだけで、PCでもiPadでも使えます。">
<link rel="stylesheet" href="../lib/toolbox.css">
</head>
<body data-page="joho2">
<div class="wrap">
  <header class="masthead">
    <p class="eyebrow">class-tools</p>
    <h1>情報Ⅱの道具箱</h1>
    <p class="lead">ブラウザで開くだけで使える教材です。インストールは要りません。PC でも iPad でも、そのまま動きます。</p>
    <ol class="howto" aria-label="iPadで開く手順">
      <li><span class="n">1</span>「QR を大きく表示」をスクリーンに映す</li>
      <li><span class="n">2</span>iPad のカメラで QR を読み取る</li>
      <li><span class="n">3</span>出てきたリンクを押して開く</li>
    </ol>
    <p class="backlink"><a href="../">← 科目を選びなおす</a></p>
  </header>

  <main class="list" id="list" aria-label="教材の一覧">
    <noscript>
      <p><a href="../interval/">信頼区間シミュレーター</a></p>
    </noscript>
  </main>

  <footer>
    QR コードの生成に <a href="https://github.com/kazuhikoarase/qrcode-generator">qrcode-generator</a>（Copyright (c) 2009 Kazuhiko Arase／<a href="../lib/qrcode-generator/LICENSE">MIT License</a>）を使っています。「QR コード」は株式会社デンソーウェーブの登録商標です。
  </footer>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="bigTitle" hidden>
  <button type="button" class="btn close" id="closeBig">閉じる</button>
  <div class="big">
    <p class="tag" id="bigTag"></p>
    <h2 id="bigTitle"></h2>
    <div class="qr-img" id="bigQr"></div>
    <p class="url" id="bigUrl"></p>
  </div>
</div>

<script src="../lib/qrcode-generator/qrcode.js"></script>
<script src="../lib/toolbox.js"></script>
</body>
</html>
